name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: tongxing-github-release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE "s/^[[:space:]]*versionName '([0-9]+\.[0-9]+\.[0-9]+)'[[:space:]]*$/\1/p" android/app/build.gradle)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          apk="tongxing-$version.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          if [[ ! -f "downloads/$apk" ]]; then
            echo "::notice::Publish the signed APK and SHA256SUMS on GitHub Releases for $tag."
            exit 0
          fi
          (cd downloads && sha256sum --strict -c SHA256SUMS)
          unzip -p "downloads/$apk" assets/tongxing-LICENSE.txt | cmp LICENSE -
          gh release create "$tag" "downloads/$apk" downloads/SHA256SUMS \
            --target "$GITHUB_SHA" --title "同行 $version" --generate-notes
